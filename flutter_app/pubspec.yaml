name: notify_jobs
description: "Notify Jobs - Government Jobs, Results, Admit Cards. One App."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Cloud Services
  firebase_core: ^3.4.0
  cloud_firestore: ^5.4.1
  firebase_messaging: ^15.1.1

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Ads & Monetization
  google_mobile_ads: ^5.1.0

  # Local Persistence & Utilities
  shared_preferences: ^2.2.3
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/mock_data.json
